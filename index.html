<!doctype html>
<html lang="ru" class="read-only"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Личный органайзер: расписание, задачи и медиатека."><title>Мой органайзер</title>
<link rel="icon" href="data:,"><link rel="stylesheet" href="styles.css?v=calendar-2"><link rel="stylesheet" href="calendar.css?v=readonly-1"><script src="app.js?v=readonly-1" defer></script><script src="calendar.js?v=readonly-1" defer></script></head>
<body><main>
<nav class="app-nav" aria-label="Разделы"><button class="active" data-view="shelf">Полка</button><button data-view="calendar">Календарь</button><button data-view="tasks">Задачи</button></nav>
<section id="shelf-view" class="view"><div class="view-head"><div><h1>Полка</h1><p>Фильмы, сериалы и книги</p></div><button class="primary" id="add-media">Добавить</button></div>
<nav class="media-nav" id="type-filters"><button class="active" data-type="all">Все <span id="count-all">0</span></button><button data-type="movie">Фильмы <span id="count-movie">0</span></button><button data-type="series">Сериалы <span id="count-series">0</span></button><button data-type="book">Книги <span id="count-book">0</span></button></nav>
<section class="stats"><div><strong id="stat-total">0</strong><span>в коллекции</span></div><div><strong id="stat-finished">0</strong><span id="stat-finished-label">просмотрено и прочитано</span></div><div><strong class="accent" id="stat-waiting">0</strong><span>в ожидании</span></div></section>
<div class="toolbar"><div class="filters" id="status-filters"><button class="active" data-status="all">Все</button><button data-status="waiting">В ожидании</button><button data-status="watched">Просмотрено</button><button data-status="read">Прочитано</button></div><input id="search" type="search" placeholder="Название или автор"></div>
<p class="meta" id="result-count">Загрузка…</p><div class="table-wrap"><table><thead><tr><th>Название</th><th>Год</th><th>Статус</th><th>Дата добавления</th><th id="completed-heading">Дата завершения</th><th></th></tr></thead><tbody id="entries"></tbody></table></div><div class="empty" id="shelf-empty" hidden>Записей пока нет.</div></section>
<section id="calendar-view" class="view" hidden><div class="view-head"><div><h1>Календарь</h1><p>Личное расписание</p></div><button class="primary" id="add-event">Добавить событие</button></div><div class="calendar-controls"><button id="prev-month">←</button><h2 id="month-title"></h2><button id="next-month">→</button><button class="text-button" id="today">Сегодня</button></div><div class="calendar-grid weekdays"><span>Пн</span><span>Вт</span><span>Ср</span><span>Чт</span><span>Пт</span><span>Сб</span><span>Вс</span></div><div class="calendar-grid" id="calendar-grid"></div></section>
<section id="tasks-view" class="view" hidden><div class="view-head"><div><h1>Задачи</h1><p>Текущие дела и сроки</p></div><button class="primary" id="add-task">Добавить задачу</button></div><div class="filters" id="task-filters"><button class="active" data-task-status="all">Все</button><button data-task-status="todo">В работе</button><button data-task-status="done">Выполнено</button></div><div class="task-list" id="task-list"></div><div class="empty" id="tasks-empty" hidden>Задач пока нет.</div></section>
</main>
<dialog id="editor"><form id="editor-form"><div class="dialog-head"><h2 id="editor-title">Новая запись</h2><button type="button" class="icon-button" id="close-editor">×</button></div><div id="editor-fields"></div><p class="form-error" id="form-error"></p><div class="dialog-actions"><button type="button" class="danger" id="delete-entry" hidden>Удалить</button><span></span><button type="button" id="cancel-editor">Отмена</button><button class="primary" type="submit">Сохранить</button></div></form></dialog><div class="toast" id="toast" hidden></div>
</body></html>
